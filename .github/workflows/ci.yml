name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build FreshmanBootstrap.slnx -c Release --nologo

      - name: Test
        run: dotnet test tests/FreshmanBootstrap.Tests/FreshmanBootstrap.Tests.csproj -c Release --no-build --nologo
